name: showcase

# README 首屏 WebP 的实机录制（手动触发）。
# 本机没有可用 WebGL 时，用 GitHub Actions 的 Xvfb + Mesa 渲染 180 帧，
# 再合成 docs/assets/showcase.webp，产物从 Artifacts 下载。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: 安装 Chromium / Xvfb / Mesa / 中文字体 / ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium xvfb libgl1-mesa-dri mesa-utils fonts-noto-cjk ffmpeg
      - run: npm ci
      - run: npm run build
      - name: 录制实机帧
        run: xvfb-run -a -s "-screen 0 1280x760x24" node scripts/capture-showcase.mjs
        env:
          CHROME_PATH: /usr/bin/chromium
          MC_HEADLESS: "0"
          MC_GL: desktop
      - name: 合成首屏 WebP（720px / 10fps / libwebp_anim 有损压缩）
        run: |
          mkdir -p docs/assets
          ffmpeg -y -framerate 12 -i test/artifacts/showcase/frame-%03d.png \
            -vf "fps=10,scale=720:-1:flags=lanczos" \
            -c:v libwebp_anim -quality 25 -preset icon -loop 0 docs/assets/showcase.webp
          ls -lh docs/assets/showcase.webp
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-webp
          path: docs/assets/showcase.webp
