name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # 浏览器测试在 Xvfb 下以 headful + Mesa llvmpipe 运行，要求 100% PASS。
    # MC_HEADLESS / MC_GL 是全站统一的，CHROME_PATH 由「准备可用的 Chromium」步骤探测后写入 GITHUB_ENV。
    env:
      MC_HEADLESS: "0"
      MC_GL: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: 安装 Xvfb / Mesa 软件渲染
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      # Ubuntu 官方源的 chromium 是 snap 过渡包（2:1snap1-*），在 runner 上能否启动全看运气：
      # puppeteer 会卡在「等待 WS endpoint URL」直到 30s 超时（曾导致主分支连续挂）。
      # 因此按优先级取用稳定来源：镜像自带 google-chrome > Chrome for Testing > 兜底 apt。
      - name: 准备可用的 Chromium
        run: |
          set -e
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN="$(command -v google-chrome)"
            echo "使用镜像自带 google-chrome：$CHROME_BIN"
          else
            echo "镜像无 google-chrome，安装 Chrome for Testing"
            npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/pptr-browsers"
            CHROME_BIN="$(find "$HOME/.cache/pptr-browsers" -type f -name chrome | head -1)"
          fi
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "前述来源不可用，兜底安装 apt chromium-browser（可能仍失败）"
            sudo apt-get update && sudo apt-get install -y chromium-browser
            CHROME_BIN=/usr/bin/chromium
          fi
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - run: npm ci
      # 任务卡契约校验器：outputs 未覆盖在 --strict 下会让 CI 失败
      - name: 任务卡契约校验
        run: python3 docs/agent/validate.py --strict
      # 核验拆成阶段步骤：任一段失败时 GitHub 直接显示失败阶段名，
      # 不必再翻日志猜「exit code 1」出自哪条命令。顺序与 `npm run verify` 完全一致。
      - name: 阶段 1/7 · 版本与静态门禁
        run: xvfb-run -a -s "-screen 0 1280x760x24" npm run check:version && npm run test:permtable && npm run wasm:check
      - name: 阶段 2/7 · Lint 与类型检查
        run: npm run lint && npm run check && npm run typecheck
      - name: 阶段 3/7 · 构建单文件产物
        run: npm run build
      - name: 阶段 4/7 · 快照重建与核心逻辑
        run: npm run test:snapshot && npm run test:perf && npm run test:drop && npm run test:ai:vitest && npm run test:wasm && npm run test:plugin-v2 && npm run test:plugin-carrier && npm run test:review-fixes
      - name: 阶段 5/7 · 逻辑回归与服务层
        run: npm run test:logic && npm run test:logic:vitest && npm run test:vitest && npm run test:light && npm run test:mesher && npm run test:services && npm run test:diagnostics && npm run test:worker-pool && npm run test:unstuck && npm run test:edits && npm run test:retention && npm run test:terrain-system
      - name: 阶段 6/7 · 玩法系统（植物 / 合成 / 装备 / 熔炉）
        run: npm run test:feel && npm run test:botany && npm run test:plant-energy && npm run test:crossbreed && npm run test:botany-rules && npm run test:crafting:vitest && npm run test:equipment && npm run test:hooks && npm run test:smelting
      - name: 阶段 7/7 · 浏览器实景（Xvfb + Mesa llvmpipe）
        # 整条测试链必须在同一个 xvfb-run 会话内：若只包住第一条命令，
        # 后续 test:options/mobile/visual 会丢失 $DISPLAY 并以 Missing X server 失败。
        run: xvfb-run -a -s "-screen 0 1280x760x24" bash -c 'npm run test:smoke && npm run test:options && npm run test:mobile && npm run test:visual'
      - name: 上传实景截图与结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test/artifacts
