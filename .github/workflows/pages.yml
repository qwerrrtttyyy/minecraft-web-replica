name: pages

# P2：线上世界只允许在 verify 全绿后部署。
# verify 与 pages 是两个独立 workflow，跨 workflow 不能用 needs，
# 因此用 workflow_run 监听 verify 的完成事件，并在 conclusion=success 时才部署。
on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 手动触发始终允许；自动触发仅在 verify 成功时放行
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # 部署 verify 验证过的那个提交，而不是触发时的分支最新提交
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Pages 用多文件产物：three.js 独立分包命中长缓存，首屏可并行拉取
      - name: 构建多文件页面
        run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
