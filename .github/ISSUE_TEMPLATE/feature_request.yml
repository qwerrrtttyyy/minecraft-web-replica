name: 功能提议
description: 提议一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提议！清晰的动机与场景描述比实现细节更重要。
        涉及大改动的提议会先在讨论中对齐方向，再进入开发。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      description: 这个功能为谁、在什么场景下解决什么问题？
      placeholder: 例如：生存模式下矿洞里火把不够用时，希望有……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望游戏 / API 变成什么样？有原版参照物的话请注明（如「类似原版的 XX 机制」）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围（帮助归类）
      options:
        - 玩法 / 内容（方块、生物、生存机制）
        - 画面 / 音频
        - 性能 / 移动端
        - 扩展 API / 插件系统
        - 工程 / 测试 / CI
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue / PR，没有重复提议
          required: true
        - label: 此提议不包含任何原版资源（贴图、音效等）
          required: true
