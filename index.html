<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#78a7ff" />
  <meta name="description" content="基于 three.js 的体素沙盒游戏，支持生存/创造、离线游玩。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MC-TS" />
  <meta property="og:title" content="我的世界 · Minecraft TS 复刻" />
  <meta property="og:description" content="基于 three.js 的体素沙盒游戏，支持生存/创造、离线游玩。" />
  <meta property="og:image" content="./showcase.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    // file:// 下 <link rel="manifest"> 会触发跨域请求错误（PWA 本身也不可用），
    // 只在 http(s) 协议注入，保持控制台干净、自动化测试的 error 断言不被污染。
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = './manifest.webmanifest';
      document.head.appendChild(link);
    }
  </script>
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>我的世界 · Minecraft TS 复刻</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1026; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- N1：普通浏览器竖屏兜底（PWA 安装态由 manifest 的 landscape 锁定） -->
  <div id="rotate-gate" hidden>
    <div class="rotate-gate-panel">
      <svg class="rotate-gate-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="19" y="7" width="26" height="50" rx="3" fill="none" stroke="currentColor" stroke-width="4" />
        <path d="M9 42a23 23 0 0 0 39 8" fill="none" stroke="#ffd54a" stroke-width="4" stroke-linecap="round" />
        <path d="M48 50V38m0 12H36" fill="none" stroke="#ffd54a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="rotate-gate-title">请旋转设备至横屏</div>
      <div class="rotate-gate-desc">横屏游玩视野更完整，按键与快捷栏会按横屏布局显示。</div>
      <button type="button" class="rotate-gate-play">仍要游玩</button>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // 仅在 http(s) 下注册 Service Worker：file://（单文件双击 / 自动化测试）注册会抛未捕获异常
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
