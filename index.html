<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#78a7ff" />
  <meta name="description" content="基于 three.js 的体素沙盒游戏，支持生存/创造、离线游玩。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MC-TS" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>我的世界 · Minecraft TS 复刻</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1026; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // 仅在 http(s) 下注册 Service Worker：file://（单文件双击 / 自动化测试）注册会抛未捕获异常
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
