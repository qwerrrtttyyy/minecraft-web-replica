id: A2-3
title: combat:damage-incoming 扩展点 + armor 插件接入
description: |
  护甲插件化第三张卡（重写 WIP E02 的战斗接线）：
  核心新增管道语义扩展点 combat:damage-incoming（survival.ts 受伤结算入口，
  核心自身零处理器），与通知语义扩展点 equipment:durability。
  armor 内置插件注册减伤处理器：armorPoints 截断 20、每点减伤 4%，
  受击后 damageArmor 扣甲耐久。装备栏 UI 经 PluginContext 挂载，
  不触碰 src/main.ts 与 src/ui/**（与 WIP 的本质区别）。
touch:
  allow:
    - src/core/types.ts
    - src/player/survival.ts
    - src/services/plugins/extensions.ts
    - src/plugins/builtin/armor.ts
    - src/plugins/builtin/index.ts
    - src/services/plugins/PluginContext.ts
    - test/armor-check.cjs
    - package.json
    - docs/agent/tasks/A2-3-armor-plugin.yaml
    - docs/TESTING.md
    - docs/ARCHITECTURE.md
  deny:
    - src/main.ts
    - src/ui/**
    - src/save/**
outputs:
  - combat:damage-incoming 管道语义落地，核心自身不注册处理器
  - core:armor 插件减伤曲线 0/10/20 点正确（每点 4%，上限 80%）
  - 卸载 armor 插件后伤害路径与 1.5.1 行为零差异（A/B 对照，core:armor 卸载零残留）
  - 装备栏 UI 经 PluginContext 挂载，main.ts 无新增接线（DESIGN-V2-ARMOR §2）
  - test:armor 独立回归通过；verify 全绿
