id: E01
title: 装备物品与定义表 + 纹理
description: |
  装备系统第一张卡：建立装备定义表（EQUIPMENT）与物品表（ITEMS）中的装备/材料条目，
  绘制全部装备与材料纹理，并把煤矿石掉落改为煤（燃料材料）。
  不含战斗 / 挖掘接入、不含 UI、不含烧炼逻辑。
touch:
  allow:
    - src/player/equipment.ts
    - src/player/survival.ts
    - docs/agent/validate.py
    - src/world/blocks.ts
    - src/gfx/atlas.ts
    - test/equipment-check.cjs
    - scripts/build-test-snapshot.mjs
    - package.json
    - docs/agent/tasks/E01-equipment-items.yaml
    - docs/TESTING.md
    - AGENTS.md
  deny:
    - src/player/player.ts
    - src/player/crafting.ts
    - src/ui/**
    - src/main.ts
    - src/save/**
outputs:
  - EQUIPMENT 定义表覆盖 5 材质剑/镐/斧/锹与 4 材质盔甲
  - ITEMS 含全部装备与材料，tile 与 EQUIPMENT 一致
  - 新增纹理注册在图集末尾，既有 tile 索引不变
  - test:equipment 纯逻辑回归通过
  - typecheck / build 通过
