id: E03
title: 熔炉 / 燃料 / 烧炼
description: |
  装备系统第三张卡：新增熔炉方块（末位追加 id 110）与燃料表，
  实现可后台进行的烧炼状态机（燃料、输入、进度、自动续料、产出自动入包），
  右键熔炉打开烧炼面板，并接入存档。煤来自煤矿石掉落。
  不含装备合成配方 / 怪物掉落 / 装备面板。
touch:
  allow:
    - src/player/smelting.ts
    - src/player/crafting.ts
    - src/world/blocks.ts
    - src/gfx/atlas.ts
    - src/player/player.ts
    - src/services/events/GameEvents.ts
    - src/ui/furnace.ts
    - src/ui/hud.ts
    - src/ui/styles.css
    - src/main.ts
    - src/save/save.ts
    - test/smelting-check.cjs
    - test/terrain-system-check.cjs
    - scripts/build-test-snapshot.mjs
    - package.json
    - docs/agent/tasks/E03-furnace-fuel.yaml
    - docs/agent/validate.py
    - docs/TESTING.md
    - AGENTS.md
    - docs/PROJECT-EXPERIENCE.md
  deny:
    - test/visual-check.mjs
    - test/survival-smoke.mjs
outputs:
  - 熔炉方块 id 110 末位追加，烧炼与燃料配置集中在 smelting.ts
  - 烧炼支持燃料耗尽停止 / 自动续料 / 产出自动入包
  - 右键熔炉打开烧炼面板，关闭后台继续，存档向后兼容
  - test:smelting 纯逻辑回归通过
  - typecheck / lint / build / validate --strict 通过
