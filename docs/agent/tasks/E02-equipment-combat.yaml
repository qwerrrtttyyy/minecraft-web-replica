id: E02
title: 装备状态与战斗 / 挖掘接入
description: |
  装备系统第二张卡：实现装备状态（4 甲槽 / 耐久 / 属性汇总）、护甲减伤，
  把武器攻击力与工具挖掘倍率接入战斗和挖掘，并给方块配置工具类别。
  不含合成配方 / 熔炉 / UI / 怪物掉落。
touch:
  allow:
    - src/player/equipmentState.ts
    - src/player/equipment.ts
    - src/player/survival.ts
    - src/player/player.ts
    - src/world/blocks.ts
    - src/services/events/GameEvents.ts
    - src/save/save.ts
    - test/equipment-check.cjs
    - test/logic-check.cjs
    - scripts/build-test-snapshot.mjs
    - package.json
    - docs/agent/tasks/E02-equipment-combat.yaml
    - docs/agent/validate.py
    - docs/TESTING.md
    - docs/AGENTS.md
    - AGENTS.md
    - docs/PROJECT-EXPERIENCE.md
  deny:
    - src/ui/**
    - src/main.ts
    - src/player/crafting.ts
outputs:
  - EquipmentState 管理 4 甲槽 / 耐久 / 属性汇总并支持存档
  - 护甲减伤按每点 4% 上限 80% 计算，受击扣甲耐久
  - 武器攻击力接入 attack，工具倍率按方块类别接入挖掘
  - test:equipment 与 test:logic 覆盖装备状态与减伤
  - typecheck / lint / build 通过
