id: N01
title: 群系配置表与气候级联扩展
description: |
  generator.ts 的 BiomeId 末尾追加 7 项（jungle/snowy_tundra/mushroom_grove/
  bamboo_grove/dark_forest/birch_forest/snowy_taiga），BIOME_PROFILES 补齐 18 项，
  DEFAULT_TERRAIN.treeDensity 补 7 键，0 新方块 id / 0 新 tile。
  base() 级联在旧 11 条谓词一字不改的前提下插入 7 条新规则，
  抢占关系按 spec 台账在代码注释中留档。
  测试：11→18 群系、方块名可解析、treeDensity 键、旧谓词顺序、新规则顺序。

touch:
  allow:
    - src/world/generator.ts
    - test/terrain-system-check.cjs
    - docs/superpowers/plans/2026-11-22-new-biomes-expansion.md
    - docs/superpowers/specs/2026-11-22-new-biomes-expansion-design.md
  deny:
    - src/world/blocks.ts
    - src/gfx/atlas.ts
    - src/world/mesher.ts
    - package.json
    - docs/agent/validate.py

outputs:
  - new biomes: BIOME_PROFILES 覆盖 18 个群系且全部方块名可解析
  - biome cascade: 旧 11 条谓词不变、7 条新规则按 spec 台账插入
  - verify: npm run typecheck && npm run test:snapshot && npm run test:terrain-system 全绿（可达性断言由 N03 收口）
