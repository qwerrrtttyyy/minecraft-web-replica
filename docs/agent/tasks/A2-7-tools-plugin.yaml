id: A2-7
title: core:tools 工具档位（挖掘倍率 + 采集等级 + 剑伤害 + 手持耐久 + 耐久条）
description: |
  设计见 docs/superpowers/specs/2026-11-22-armor-tools-closure-design.md §5。依赖 A2-5，可与 A2-6 并行。
  规则表放在 src/player/toolRules.ts（按方块 sound 材质推断镐/斧/锹 + 少量按名覆写 harvestTier），
  核心方块定义不加字段、方块 id 不变。
  未达标工具挖矿：耗时 ×3.3 且无掉落（决策 2），受实验性开关 requireCorrectTool 控制（默认开）。
  剑按 def.attack 改攻击伤害；挖掘/攻击扣手持耐久，损坏移除物品；快捷栏画耐久条。
touch:
  allow:
    - src/player/toolRules.ts
    - src/player/equipment.ts
    - src/plugins/builtin/tools.ts
    - src/plugins/builtin/index.ts
    - src/core/options.ts
    - scripts/build-test-snapshot.mjs
    - test/tools-check.cjs
    - package.json
    - docs/agent/tasks/A2-7-tools-plugin.yaml
    - docs/TESTING.md
  deny:
    - src/main.ts
    - src/ui/**
    - src/world/blocks.ts
    - src/core/version.ts
outputs:
  - tool rules: 全部内置方块都有工具归属，矿石/黑曜石有采集等级，对口工具按 miningSpeed 加速
  - tool harvest gate: requireCorrectTool 开启时未达标镐挖矿无掉落，关闭时只保留加速
  - tool durability: 剑按档位加伤，挖掘/攻击扣手持耐久，损坏移除物品，快捷栏显示耐久条
  - test:tools: test/tools-check.cjs 覆盖规则归属 / 倍率 / 采集等级 / 耐久损坏 / 停用零差异，verify 链包含它
